---
services:
  cache-watchtower:
    image: nickfedor/watchtower:latest
    container_name: cache-watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always
    environment:
      WATCHTOWER_NOTIFICATIONS_HOSTNAME: linux-cache
      WATCHTOWER_POLL_INTERVAL: 3600
    networks:
      - cache

  cache-restarter:
    image: ghcr.io/credfeto/cache-restarter:latest
    container_name: cache-restarter
    hostname: cache-restarter
    restart: always
    stop_grace_period: 5s
    stop_signal: SIGINT
    network_mode: none
    environment:
      - RESTARTER_TAG=linuxpkg
    cap_drop:
      - ALL
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  cache:
    driver: bridge
    enable_ipv6: true


volumes:
  cache-pacman:
    name: cache-pacman
    external: true
  cache-flathub:
    name: cache-flathub
    external: true
